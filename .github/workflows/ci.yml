name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt ruff==0.17.1
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Check dependencies against known advisories
        if: matrix.python == '3.12'
        run: python -m pip install pip-audit==2.10.1 && python -m pip_audit -r requirements.txt
  astrbot-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Native APIs with synthetic data, no external network
        run: >-
          docker run --rm --network none --entrypoint python3
          -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/AstrBot:/plugin
          -v "$PWD:/plugin:ro" -w /AstrBot
          soulter/astrbot@sha256:a140a326163ac5f82f62153f033cddeac74e38e4ee1809c6e333e950ff19edc4
          -m unittest discover -s /plugin/tests -v
